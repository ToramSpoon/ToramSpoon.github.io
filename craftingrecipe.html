<!DOCTYPE html>
<html>

<head>
    <title>Toram Spoon - Crafting Recipe Compendium</title>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel='shortcut icon' type='image/x-icon' href='./favicon.ico' />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/craftingrecipe.css" />
</head>

<body>
    <nav>
        <a href="index.html" class="home-link">
            <img src="./media/images/logo.svg" alt="toramspoon logo" class="toramspoon-logo">
        </a>
        <div class="spacer">
            <h3> Spoonfeeding Toram Players </h3>
        </div>
    </nav>

    <form class="container main">
        <fieldset class="section" id="parameters">
            <legend>Parameters</legend>
            <div class="grid grid-2">
                <label for="craft_type">Craft Type</label><select id="craft_type"></select>
                <label for="event_name">Event Name</label><select id="event_name"></select>
                <label for="item_type">Item Type</label><select id="item_type"></select>
                <label for="item_name">Item Name</label><select id="item_name"></select>
            </div>
        </fieldset>

        <fieldset class="section" id="item_details">
            <legend> Item Details</legend>
            <div id="item_info"></div>
        </fieldset>
    </form>

    <div class="footer">
        Developed by ToramSpoon based on <a class="credits" href="https://toramtools.github.io" target="_blank">ToramTools</a>.
    </div>
</body>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="js/main.js"></script>
<script src="js/craftingrecipe.js"></script>

</html>
